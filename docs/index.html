<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Weight Deltas to Steering Vectors</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --max-w: 820px; --text: #1a1a1a; --muted: #555; --accent: #8b0000; --bg: #fff; --rule: #ccc; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Libre Baskerville', 'Times New Roman', serif; font-size: 15px; line-height: 1.65; color: var(--text); background: var(--bg); }
.paper { max-width: var(--max-w); margin: 0 auto; padding: 40px 24px 80px; }

/* Title block */
.title-block { text-align: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
.title-block h1 { font-size: 24px; line-height: 1.3; margin-bottom: 12px; font-weight: 700; }
.title-block .author { font-size: 16px; color: var(--muted); margin-bottom: 4px; }
.title-block .date { font-size: 13px; color: #888; }

/* Abstract */
.abstract { background: #f9f9f9; border-left: 3px solid var(--accent); padding: 16px 20px; margin-bottom: 32px; font-size: 14px; line-height: 1.6; }
.abstract .label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); display: block; margin-bottom: 6px; }

/* Sections */
h2 { font-size: 18px; margin-top: 36px; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 1px solid #eee; color: var(--accent); }
h3 { font-size: 15px; margin-top: 24px; margin-bottom: 8px; font-weight: 700; }
p { margin-bottom: 12px; text-align: justify; hyphens: auto; }
ul, ol { margin: 0 0 12px 24px; }
li { margin-bottom: 4px; }

/* Math */
.katex-display { margin: 20px 0; overflow-x: visible; overflow-y: visible; }
.katex-display > .katex { text-align: center; }
.katex { font-size: 1.1em; }

/* Tables */
table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
th, td { padding: 6px 10px; border: 1px solid #ddd; text-align: left; }
th { background: #f5f5f5; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
td:first-child { font-weight: 500; }

/* Figures */
figure { margin: 24px 0; text-align: center; }
figure img { max-width: 100%; height: auto; border: 1px solid #eee; border-radius: 2px; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; text-align: left; padding: 0 12px; }
figcaption strong { color: var(--text); }

/* Code */
code { font-family: 'Source Code Pro', monospace; font-size: 13px; background: #f4f4f4; padding: 1px 4px; border-radius: 2px; }

/* References */
.references { font-size: 13px; }
.references p { text-indent: -20px; padding-left: 20px; margin-bottom: 6px; }

/* Appendix */
.appendix h2 { color: var(--muted); }

/* Responsive */
@media (max-width: 600px) {
  .paper { padding: 20px 16px 60px; }
  .title-block h1 { font-size: 20px; }
  body { font-size: 14px; }
  table { font-size: 11px; }
  th, td { padding: 4px 6px; }
}

/* Print */
@media print {
  .paper { max-width: none; padding: 0; }
  h2 { break-after: avoid; }
  figure { break-inside: avoid; }
}
</style>
</head>
<body>
<article class="paper" id="content"></article>
<script id="paper-md" type="text/markdown">
</script>
<script>
// We load the markdown from a separate fetch to keep this file small
fetch('paper.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = renderPaper(md);
    renderMathInElement(document.getElementById('content'), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });
  });

function renderPaper(md) {
  // Split into lines and process
  const lines = md.split('\n');
  let html = '';
  let inTable = false;
  let tableRows = [];
  let inList = false;
  let listType = 'ul';
  let listItems = [];

  function flushList() {
    if (!inList) return '';
    inList = false;
    const tag = listType;
    const out = `<${tag}>${listItems.map(li => `<li>${inlineFormat(li)}</li>`).join('')}</${tag}>`;
    listItems = [];
    return out;
  }

  function splitTableRow(row) {
    // Split on | but protect $...$ math spans that may contain pipes
    const cells = [];
    let cur = '';
    let inMath = false;
    for (let c = 0; c < row.length; c++) {
      if (row[c] === '$' && !inMath) { inMath = true; cur += '$'; }
      else if (row[c] === '$' && inMath) { inMath = false; cur += '$'; }
      else if (row[c] === '|' && !inMath) { cells.push(cur); cur = ''; }
      else { cur += row[c]; }
    }
    if (cur) cells.push(cur);
    return cells.filter(c => c.trim() !== '');
  }

  function flushTable() {
    if (!inTable) return '';
    inTable = false;
    if (tableRows.length === 0) return '';
    let t = '<table>';
    tableRows.forEach((row, i) => {
      const cells = splitTableRow(row);
      const tag = i === 0 ? 'th' : 'td';
      if (i === 1 && cells.every(c => /^[\s\-:]+$/.test(c))) return;
      t += '<tr>' + cells.map(c => `<${tag}>${inlineFormat(c.trim())}</${tag}>`).join('') + '</tr>';
    });
    t += '</table>';
    tableRows = [];
    return t;
  }

  function inlineFormat(text) {
    // Protect math spans from formatting
    const mathSpans = [];
    text = text.replace(/\$\$[\s\S]+?\$\$/g, m => { mathSpans.push(m); return `%%MATH${mathSpans.length-1}%%`; });
    text = text.replace(/\$[^$]+?\$/g, m => { mathSpans.push(m); return `%%MATH${mathSpans.length-1}%%`; });
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Links
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    // Restore math
    text = text.replace(/%%MATH(\d+)%%/g, (_, idx) => mathSpans[parseInt(idx)]);
    return text;
  }

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    // Skip horizontal rules
    if (/^---+$/.test(trimmed)) { html += flushList() + flushTable(); i++; continue; }

    // Images -> figures
    const imgMatch = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if (imgMatch) {
      html += flushList() + flushTable();
      const alt = imgMatch[1];
      const src = imgMatch[2];
      const capMatch = alt.match(/^(Figure\s+\S+?):?\s*(.*)/i);
      const caption = capMatch
        ? `<strong>${capMatch[1]}:</strong> ${inlineFormat(capMatch[2])}`
        : inlineFormat(alt);
      const tallFigs = ['figA1_heatmap', 'figA2_gate'];
      const isTall = tallFigs.some(f => src.includes(f));
      const style = isTall ? ' style="max-height:480px;width:auto"' : '';
      html += `<figure><img src="${src}" alt="${alt}" loading="lazy"${style}><figcaption>${caption}</figcaption></figure>`;
      i++; continue;
    }

    // Title
    if (trimmed.startsWith('# ') && !trimmed.startsWith('## ')) {
      html += flushList() + flushTable();
      const title = trimmed.slice(2);
      // Look ahead for author
      let author = '';
      let dateStr = 'September 2026';
      if (i + 1 < lines.length) {
        const next = lines[i+1].trim();
        if (next.startsWith('**') && next.endsWith('**')) {
          author = next.slice(2, -2);
          i++;
        }
      }
      html += `<div class="title-block"><h1>${inlineFormat(title)}</h1>`;
      if (author) html += `<div class="author">${author}</div>`;
      html += `<div class="date">${dateStr}</div></div>`;
      i++; continue;
    }

    // Abstract
    if (trimmed === '## Abstract') {
      html += flushList() + flushTable();
      i++;
      let absText = '';
      while (i < lines.length && !lines[i].trim().startsWith('## ') && !lines[i].trim().startsWith('---')) {
        absText += lines[i] + ' ';
        i++;
      }
      html += `<div class="abstract"><span class="label">Abstract</span>${inlineFormat(absText.trim())}</div>`;
      continue;
    }

    // Section headers
    if (trimmed.startsWith('### ')) {
      html += flushList() + flushTable();
      html += `<h3>${inlineFormat(trimmed.slice(4))}</h3>`;
      i++; continue;
    }
    if (trimmed.startsWith('## ')) {
      html += flushList() + flushTable();
      const heading = trimmed.slice(3);
      const isAppendix = /^Appendix|^References/.test(heading);
      const cls = isAppendix ? ' class="appendix"' : '';
      html += `<h2${cls ? ' style="color:#555"' : ''}>${inlineFormat(heading)}</h2>`;
      i++; continue;
    }

    // Tables
    if (trimmed.startsWith('|')) {
      html += flushList();
      if (!inTable) { inTable = true; tableRows = []; }
      tableRows.push(trimmed);
      i++; continue;
    } else if (inTable) {
      html += flushTable();
    }

    // Lists
    if (/^\d+\.\s/.test(trimmed)) {
      html += flushTable();
      if (!inList || listType !== 'ol') { html += flushList(); inList = true; listType = 'ol'; }
      listItems.push(trimmed.replace(/^\d+\.\s/, ''));
      i++; continue;
    }
    if (/^[-*]\s/.test(trimmed)) {
      html += flushTable();
      if (!inList || listType !== 'ul') { html += flushList(); inList = true; listType = 'ul'; }
      listItems.push(trimmed.replace(/^[-*]\s/, ''));
      i++; continue;
    }
    if (inList && trimmed === '') {
      // Look ahead: if the next non-empty line is another list item of the same type, keep the list open
      let peek = i + 1;
      while (peek < lines.length && lines[peek].trim() === '') peek++;
      const nextLine = peek < lines.length ? lines[peek].trim() : '';
      const nextIsOl = /^\d+\.\s/.test(nextLine);
      const nextIsUl = /^[-*]\s/.test(nextLine);
      if ((listType === 'ol' && nextIsOl) || (listType === 'ul' && nextIsUl)) {
        i++; continue; // skip blank line, keep list open
      }
      html += flushList(); i++; continue;
    }
    if (inList && !trimmed.startsWith(' ')) { html += flushList(); }

    // Display math — emit raw $$...$$ and let KaTeX auto-render handle it
    if (trimmed.startsWith('$$')) {
      html += flushList() + flushTable();
      let math = trimmed;
      if (trimmed.endsWith('$$') && trimmed.length > 4) {
        html += `<p>${math}</p>`;
      } else {
        i++;
        while (i < lines.length && !lines[i].trim().endsWith('$$')) {
          math += '\n' + lines[i];
          i++;
        }
        if (i < lines.length) math += '\n' + lines[i].trim();
        html += `<p>${math}</p>`;
      }
      i++; continue;
    }

    // Paragraphs
    if (trimmed === '') { i++; continue; }
    html += `<p>${inlineFormat(trimmed)}</p>`;
    i++;
  }
  html += flushList() + flushTable();
  return html;
}
</script>
</body>
</html>
